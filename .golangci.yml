version: "2"

linters:
  enable:
    - lll
    - misspell
    - unconvert

  settings:
    lll:
      line-length: 120
      tab-width: 4

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - examples
      - testdata

formatters:
  enable:
    - gofmt
    - goimports
