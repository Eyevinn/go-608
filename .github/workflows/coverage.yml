name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Generate coverage
        run: go test -coverpkg=./... -coverprofile=profile.cov ./...

      # Upload to Coveralls. Marked non-fatal so a repo without Coveralls
      # activated does not red the workflow; activate the repo on
      # coveralls.io to make the badge live.
      - name: Upload coverage
        continue-on-error: true
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
          github-token: ${{ secrets.GITHUB_TOKEN }}
